# Configuracion de despliegue para Netlify — Mision Atabey.
# Documento de referencia: docs/DEPLOY.md

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Variables de entorno del build (definirlas en el panel de Netlify).
# VITE_API_BASE_URL = https://tu-backend-publico
# VITE_WS_BASE_URL  = wss://tu-backend-publico
# VITE_CARTO_API_KEY = <key de CARTO>

# La SPA usa rutas de cliente: todo lo que no sea un archivo existe
# debe devolver index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cabeceras de seguridad basicas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# runtime-config.js NO debe cachearse: es el archivo que permite cambiar
# la URL del backend sin redesplegar.
[[headers]]
  for = "/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
